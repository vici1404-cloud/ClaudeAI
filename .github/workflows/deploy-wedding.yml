name: Deploy wedding invitation

# Publishes the pre-built wedding invitation (this branch) to GitHub Pages.
# Note: this replaces the MixAI web preview on Pages. To restore MixAI,
# re-run its "Deploy web preview" workflow from the Actions tab.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove workflow files from the published site
        run: rm -rf .github .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
