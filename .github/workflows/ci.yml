name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test

  database:
    name: Migration + seed against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # Plain Postgres has no Supabase auth schema; stub the parts the
      # schema references so migrations apply identically to production.
      - name: Stub Supabase auth schema
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "
            create role anon;
            create role authenticated;
            create role service_role;
            create schema auth;
            create table auth.users (
              id uuid primary key,
              raw_user_meta_data jsonb not null default '{}'
            );
            create function auth.uid() returns uuid
              language sql stable as 'select null::uuid';
          "
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Apply seed
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Run assertions
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f .github/ci/db-assertions.sql
